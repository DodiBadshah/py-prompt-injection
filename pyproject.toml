[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-prompt-injection"
version = "0.1.0"
description = "A structured prompt injection test harness for LLMs. Black-box security evaluation mapped to OWASP LLM Top 10 categories LLM01, LLM02, LLM06, and LLM08."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "llm-security",
    "prompt-injection",
    "owasp-llm-top10",
    "ai-security",
    "red-teaming",
    "penetration-testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # API clients
    "anthropic>=0.25.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",            # Raw HTTP for edge-case adapter scenarios

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0", # BaseSettings for config.py

    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",

    # Logging
    "loguru>=0.7.2",

    # Reporting
    "jinja2>=3.1.4",
    "weasyprint>=62.0",

    # Experiment tracking
    "mlflow>=2.13.0",

    # Payload files
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
# Phase 2: LLM-as-judge scoring layer
# Intentionally empty in phase one. See docs/limitations.md for design rationale.
llm-judge = []

dev = [
    "pytest>=8.2.0",
    "pytest-rich>=0.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",              # Linting and formatting
    "mypy>=1.10.0",             # Type checking
    "pre-commit>=3.7.0",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.scripts]
llm-probe = "llm_probe.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["llm_probe"]

# Ruff: linting and formatting (replaces flake8 + black + isort)
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Mypy: strict type checking
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
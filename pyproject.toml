[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-prompt-injection"
version = "0.1.0"
description = "Black-box prompt injection test harness for LLMs, mapped to OWASP LLM Top 10"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API clients
    "anthropic>=0.25.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",            # Raw HTTP for edge-case adapter scenarios
    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0", # BaseSettings for config.py
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Logging
    "loguru>=0.7.2",
    # Reporting
    "jinja2>=3.1.4",
    "weasyprint>=62.0",
    # Experiment tracking
    "mlflow>=2.13.0",
    # Payload files
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
llm-probe = "llm_probe.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["llm_probe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]